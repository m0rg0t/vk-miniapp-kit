name: Toolkit fixture checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install synthetic image fixture tools
        run: sudo apt-get update && sudo apt-get install --yes librsvg2-bin imagemagick ffmpeg
      - run: npm run check
